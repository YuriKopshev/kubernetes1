apiVersion: v1
kind: Service
metadata:
  name: multi-app-internal-svc
  namespace: default
spec:
  selector:
    app: multi-app
  type: ClusterIP
  ports:
    - name: to-nginx
      protocol: TCP
      port: 9001
      targetPort: 80
    - name: to-multitool
      protocol: TCP
      port: 9002
      targetPort: 8080
