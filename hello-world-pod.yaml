apiVersion: v1
kind: Pod
metadata:
  name: netology-web
  labels:
    app: netology-echo
spec:
  containers:
    - name: echoserver
      image: registry.k8s.io/e2e-test-images/agnhost:2.45
      args:
        - netexec
        - --http-port=8080
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: netology-svc
spec:
  selector:
    app: netology-echo
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 8080
  type: ClusterIP





